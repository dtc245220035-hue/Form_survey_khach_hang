<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu Ngang Dropdown</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #menu { height: 40px; border: 1px solid #ccc; background-color: #f1f1f1; }
        #menu ul { list-style-type: none; margin: 0; padding: 0; }
        #menu ul li { float: left; position: relative; }
        #menu ul li a { display: block; width: 120px; height: 40px; line-height: 40px; text-align: center; text-decoration: none; color: black; }
        #menu ul li a:hover { background-color: red; color: white; }
        #menu ul ul { position: absolute; top: 40px; left: 0; visibility: hidden; }
        #menu ul ul li { float: none; }
        #menu ul li:hover ul { visibility: visible; }
    </style>
</head>
<body>
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                </ul>
            </li>
            <li><a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
